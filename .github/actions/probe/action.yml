name: probe
description: composite input env probe
inputs:
  secret-value:
    description: probe secret
    required: false
runs:
  using: composite
  steps:
    - name: show env from composite
      shell: bash
      run: |
        echo "=== INPUT_ vars in composite ==="
        env | grep -i '^INPUT_' || echo "(none)"
        echo "=== env names ==="
        env | cut -d= -f1 | sort | tr '\n' ' '
        echo
